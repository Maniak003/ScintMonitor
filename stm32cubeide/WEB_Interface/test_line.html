			function saveSpr() {
				const contDisp="specter.csv";
				var a = document.createElement("a");
				var file = new Blob([spectrArr], { type: "'text/plain'"});
				a.href = window.URL.createObjectURL(file);
				a.download=contDisp.replace(/\"/g,'');
				a.click();
			}
			
			function processData(jsonData) {
				drawSpecter(jsonData.dataArray);
			}

			function drawLine(x1, y1, x2, y2, color = '#000', width = 2) {
				ctx.beginPath();
				ctx.strokeStyle = color;
				ctx.lineWidth = width;
				ctx.moveTo(x1, y1);
				ctx.lineTo(x2, y2);
				ctx.stroke();
			}
			
			function drawSpecter(dataArray) {
				spectrArr = "";
				ctx.clearRect(0, 0, canvas.width, canvas.height);
				old_x = 0;
				cur_x = 0;
				old_y = 0;
				old_y_lg = 0;
				const max_y = Math.max(...dataArray);
				const koeff = 600 / max_y;
				const koefflg = 600 / Math.log(max_y);
				dataArray.forEach((value) => {
					spectrArr += value + "\n";
					drawLine(old_x, 600 - old_y * koeff, cur_x, 600 - value * koeff, 'green', 1);
					drawLine(old_x, 600 - old_y_lg * koefflg, cur_x, 600 - Math.log(value) * koefflg, 'yellow', 1);
					cur_x++;
					old_x = cur_x; 
					old_y = value;
					old_y_lg = Math.log(value);
				});
			}
			// Имитация получения данных с сервера
			function fetchData() {
				setTimeout(() => {
					const mockData = generateMockData();
					processData(mockData);
				}, 100);
			}
			// Запускаем обновление каждую секунду
			setInterval(fetchData, 1000);

			// Первоначальная загрузка
